---

default: &default
  task_bridge:
    all_supported_services:
      - Asana
      - Github
      - GoogleKeep
      - GoogleTasks
      - Instapaper
      - Omnifocus
      - Reclaim
      - Reminders
    debug: false
    delete_completed: false
    # HMAC key for the notes_digest published in normalized snapshots
    # (#219). Leave nil to derive from the deployment's secret_key_base.
    digest_key: ~
    personal_tags:
      - Personal
    work_tags: []
    log_file: log/service_sync.log
    primary_service: Omnifocus
    omnifocus_web_account: ~
    omnifocus_web_locale: ~
    omnifocus_web_password: ~
    omnifocus_web_server_label: ~
    provider_services:
      - Github
      - Instapaper
      - Asana
      - GoogleKeep
    task_services:
      - Asana
      - GoogleKeep
      - GoogleTasks
      - Omnifocus
      - Reclaim
      - Reminders
    update_ids_for_existing_items: false
    # TaskBridge Web publication (RDR #215, issue #221). Disabled by
    # default so sync behavior is unchanged until a deployment opts in.
    # The ingest key can also be provided through a 1Password `op://`
    # reference resolved by `op-cache` in the deployment's local scripts,
    # never committed here.
    web:
      enabled: false
      base_url: ~
      api_key: ~
      batch_size: 100
      timeout_seconds: 30
      retry_backoff_base_seconds: 60
      retry_backoff_max_seconds: 3600
      # Render batches (stdout) instead of sending them: development and
      # backfill preview only — HTTP push is the sole production
      # ingestion path (RDR #215).
      dry_run: false
    outbox:
      # The local outbox is a bounded queue for retries and troubleshooting,
      # not a long-term history database — TaskBridge Web owns durable history.
      retention:
        delivered_days: 7
        failed_days: 30
    sync:
      # use "0" to disable
      max_age: "0"
      services:
        - Reclaim
        - Github
        - Instapaper
        - Asana
      tags:
        - TaskBridge

  asana:
    personal_access_token: ~
    projects: TaskBridge

  github:
    access_code: github_access_code.txt
    client_id: ~
    client_secret: ~
    repositories: viamin/task_bridge

  google:
    client:
      id: ~
      secret: ~
      secrets_file: google_api_client_credentials.json
    credential_store: credentials.yaml
    tasks_list: My Tasks
    calendar:
      # Calendar IDs to observe. An empty list disables calendar ingestion.
      calendar_ids: []
      # `busy_only` publishes only availability. `event_details` additionally
      # publishes title, location, and attendee response status.
      privacy_mode: busy_only
      # Bound reads so a configured calendar cannot become an unbounded export.
      lookback_days: 7
      lookahead_days: 30

  instapaper:
    oauth:
      consumer_id: ___nil___
      consumer_secret: ___nil___
    project: ___nil___
    username: ___nil___
    password: ___nil___

  reclaim:
    api_key: ___nil___

  reminders:
    list_mapping: ___nil___

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
